# ─── SECRET ──────────────────────────────────────────────────────────────────
# A Secret stores sensitive data like passwords, API keys, and tokens.
# We use Secret (not ConfigMap) for passwords because:
#   - Secret values are base64 encoded (ConfigMap is plain text)
#   - Kubernetes can restrict who can read Secrets with RBAC
#   - Tools like Vault or Azure Key Vault can inject into Secrets safely
# IMPORTANT: Do NOT hardcode passwords in Deployment files — always use Secrets.

apiVersion: v1          # core Kubernetes API — same as Namespace and Service
kind: Secret            # we are creating a Secret resource
metadata:
  name: postgres-secret # the name of this Secret — Deployments will reference this exact name
  namespace: microservices # must be in the same namespace as the pods that use it
                           # a pod in namespace "microservices" can only read secrets in "microservices"

type: Opaque            # Opaque = general-purpose secret (just key-value pairs)
                        # other types exist: kubernetes.io/tls (for certs), kubernetes.io/dockerconfigjson (registry auth)

stringData:             # stringData lets us write values as plain text — Kubernetes converts to base64 automatically
                        # alternative: "data:" requires you to manually base64 encode each value
  POSTGRES_USER: postgres          # the PostgreSQL superuser username — postgres container reads this env var
  POSTGRES_PASSWORD: postgres123   # the PostgreSQL password — CHANGE THIS before using in production
  POSTGRES_DB: postgres            # the default database created on first start (we also create usersdb/productsdb via init.sql)
