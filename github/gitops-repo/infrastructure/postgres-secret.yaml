apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: microservices
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres123   # use a real secret manager in production
  POSTGRES_DB: postgres



# infrastructure/external-secret.yaml  ← safe to commit, no actual password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: microservices
spec:
  refreshInterval: 1h              # re-sync from Key Vault every hour
  secretStoreRef:
    name: azure-keyvault           # connection to your Azure Key Vault
    kind: ClusterSecretStore
  target:
    name: postgres-secret          # creates THIS Secret in Kubernetes
  data:
    - secretKey: POSTGRES_USER     # key name in the Kubernetes Secret
      remoteRef:
        key: postgres-user         # key name in Azure Key Vault
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-password     # Azure Key Vault has the real value


#Azure Key Vault
  postgres-user:     "postgres"        ← stored here, encrypted, access-logged
  postgres-password: "r3@lP@ssw0rd"   ← never in git, never in plain text

#External Secrets Operator (pod in cluster)
  reads ExternalSecret YAML
  calls Azure Key Vault API
  creates/updates Kubernetes Secret automatically

#Kubernetes Secret (in etcd)
  POSTGRES_USER:     "postgres"
  POSTGRES_PASSWORD: "r3@lP@ssw0rd"

Deployment secretKeyRef → reads it → injects into pod

Your deployment.yaml secretKeyRef is correctly written — the syntax is right. The only problem is the Secret it points to (postgres-secret.yaml) has the password in plain text in git.

