# ─── BLUE-GREEN DEPLOYMENT: product-service ───────────────────────────────────
# Same pattern as blue-green/user-service.yaml.
# TO SWITCH TRAFFIC: change Service selector version: blue → version: green
---
# ── BLUE DEPLOYMENT (current stable) ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-blue
  namespace: microservices
  labels:
    app: product-service
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
      version: blue
  template:
    metadata:
      labels:
        app: product-service
        version: blue
    spec:
      serviceAccountName: product-service-sa
      containers:
        - name: product-service
          image: microservicesacr.azurecr.io/product-service:1   # stable version
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: productsdb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
# ── GREEN DEPLOYMENT (new version — no traffic until Service selector flips) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-green
  namespace: microservices
  labels:
    app: product-service
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
      version: green
  template:
    metadata:
      labels:
        app: product-service
        version: green
    spec:
      serviceAccountName: product-service-sa
      containers:
        - name: product-service
          image: microservicesacr.azurecr.io/product-service:1   # Jenkins updates THIS tag
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: productsdb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
# ── SERVICE (traffic switch) ──────────────────────────────────────────────────
# CHANGE version: blue → version: green to flip 100% traffic to new version
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: product-service
    version: blue          # ← CHANGE THIS to "green" to flip traffic
  ports:
    - port: 3001
      targetPort: 3001
