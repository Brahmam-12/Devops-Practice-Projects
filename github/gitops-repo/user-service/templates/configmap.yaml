apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: microservices
data:
  LOG_LEVEL:       {{ .Values.configmap.LOG_LEVEL | quote }}
  NODE_ENV:        {{ .Values.configmap.NODE_ENV | quote }}
  APP_VERSION:     {{ .Values.configmap.APP_VERSION | quote }}
  MAX_CONNECTIONS: {{ .Values.configmap.MAX_CONNECTIONS | quote }}
  PORT:            {{ .Values.configmap.PORT | quote }}
  DB_HOST:         {{ .Values.configmap.DB_HOST | quote }}
  DB_PORT:         {{ .Values.configmap.DB_PORT | quote }}
  DB_NAME:         {{ .Values.configmap.DB_NAME | quote }}
