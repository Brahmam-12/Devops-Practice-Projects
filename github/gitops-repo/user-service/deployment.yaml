# ── user-service Deployment ───────────────────────────────────────────────────
# THIS FILE LIVES IN: github.com/company/gitops-repo
#
# WHO UPDATES THIS FILE?
#   Jenkins CI pipeline (user-service/Jenkinsfile stage: "Update GitOps Repo")
#   Jenkins clones this repo → changes the image: tag → commits → pushes.
#   Developers do NOT edit this file manually in production.
#
# WHO READS THIS FILE?
#   ArgoCD — watches this repo, detects changes, runs kubectl apply on the cluster.
#
# THE ONLY LINE THAT CHANGES PER DEPLOY:
#   image: microservicesacr.azurecr.io/user-service:BUILD_NUMBER
#   Jenkins replaces the tag (:41 → :42) with every new build.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # spin up 1 NEW pod before killing any old pod
      maxUnavailable: 0  # never remove an old pod until replacement passes readinessProbe
                         # with 2 replicas: 3 pods exist briefly during update → zero downtime
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      serviceAccountName: user-service-sa   # dedicated identity — no shared default SA
      containers:
        - name: user-service
          image: microservicesacr.azurecr.io/user-service:1   # ← Jenkins updates this tag
          ports:
            - containerPort: 3000
          # envFrom: injects ALL keys from ConfigMap as env vars in one shot.
          # Pod receives: PORT, DB_HOST, DB_PORT, DB_NAME, LOG_LEVEL, NODE_ENV,
          #               APP_VERSION, MAX_CONNECTIONS — all from configmap.yaml.
          # Syntax: key: "value" in ConfigMap → process.env.KEY in the app.
          envFrom:
            - configMapRef:
                name: user-service-config

          # env: is ONLY for values that cannot go in ConfigMap — Secrets.
          # DB_USER and DB_PASSWORD are sensitive → they come from a Secret via secretKeyRef.
          # secretKeyRef syntax is Deployment-only — never put this inside a ConfigMap.
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret    # refers to infrastructure/postgres-secret.yaml
                  key: POSTGRES_USER       # which key inside that Secret to read
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
