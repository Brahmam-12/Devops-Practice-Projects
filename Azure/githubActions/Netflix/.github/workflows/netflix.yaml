name: Pipeline fro Build and Infra
on:
  push:
    branches:
      - main

jobs:

  #Build Job
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      
      - name: Restore Dependencies
        run: dotnet restore
      
      - name: Publish
        run: dotnet publish --configuration Release --output ./publish
      
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ./publish
      
  DevInfra:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      
      - name: Install Terraform
        uses:  hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}

      - name: Terraform apply
        run: |
          cd Terraform
          terraform init --reconfigure --backend-config="backend-dev.conf"
          terraform apply -var-file="dev.tfvars" --auto-approve

  DevDeploy:
    needs: DevInfra
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ./publish
      
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
      
      - name: test
        run: |
          echo "print directory"
          pwd
          echo "list files in current directory"
          ls -la

        
      - name: Deploy in Dev Web APP
        uses: azure/webapps-deploy@v3
        with:
          app-name: netflix-dev-web-app
          package: ./publish

  QAInfra:
    runs-on: ubuntu-latest
    needs: DevDeploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Terraform install
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: latest
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}

      - name: Terraform init and apply
        run: |
          cd Terraform
          terraform init --reconfigure --backend-config="backend-qa.conf"
          terraform apply -var-file="qa.tfvars" --auto-approve

  QADeploy:
    needs: QAInfra
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ./publish

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}

      - name: Upload artifact
        uses: azure/webapps-deploy@v3
        with:
          app-name: netflix-qa-web-app
          package: ./publish